version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"

    # Labels on pull requests
    labels:
      - "dependencies"
      - "security"

    # Dependabot no longer accepts "widen" here. With "auto", it treats this
    # package as a library (the description in pyproject.toml matches the PyPI
    # summary) and widens version ranges instead of raising their lower bounds.
    versioning-strategy: "auto"

    # Allow up to 10 open pull requests at a time
    open-pull-requests-limit: 10

    # Configure commit message
    commit-message:
      prefix: "deps"
      include: "scope"

    allow:
      - dependency-type: "direct"
      - dependency-type: "indirect"

    # Group dependencies into a single PR
    groups:
      dev-dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Etc/UTC"

    labels:
      - "dependencies"

    commit-message:
      prefix: "ci"

    # Group all action updates, including major versions, into a single PR
    groups:
      github-actions:
        patterns:
          - "*"
